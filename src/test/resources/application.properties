quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:coffeeshop;MODE=MySQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.datasource.jdbc.telemetry=false
quarkus.kafka.devservices.enabled=false
quarkus.otel.sdk.disabled=true
kueche.processing.delay.min-seconds=0
kueche.processing.delay.max-seconds=0
outbox.dispatch.tick=1s
outbox.dispatch.min-seconds=1
outbox.dispatch.max-seconds=2
