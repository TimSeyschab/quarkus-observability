quarkus.micrometer.export.prometheus.enabled=true
quarkus.application.name=quarkus-observability
quarkus.datasource.db-kind=mariadb
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.otel.resource.attributes=service.name=${quarkus.application.name}

# ----------------------------------------
# Logging-Format fuer Logs-Trace-Korrelation
# Warum trace_id/span_id verpflichtend sind:
# - Loki speichert Logs, Tempo speichert Traces. Beide Systeme brauchen gemeinsame IDs.
# - trace_id ermoeglicht den direkten Sprung von einer Logzeile zum kompletten Trace in Tempo.
# - span_id zeigt exakt den Span (Operation), der den Logeintrag erzeugt hat.
# - Ohne diese Felder basiert Korrelation auf unscharfer Textsuche und ist unzuverlaessig.
# ----------------------------------------
quarkus.log.console.format=ts=%d{yyyy-MM-dd HH:mm:ss,SSS} level=%p trace_id=%X{traceId} span_id=%X{spanId} logger=%c{2.} thread=%t %s%e%n

# ----------------------------------------
# OpenTelemetry-Tracing-Konfiguration
# Mindestanforderungen vs. optionales Tuning:
# - Mindestanforderungen:
#   - quarkus.otel.enabled
#   - quarkus.otel.traces.enabled
#   - quarkus.otel.exporter.otlp.traces.endpoint
# - Optionales Tuning (abhaengig von Workload/Laufzeit):
#   - Sampler-Strategie
#   - BSP Queue/Batch/Delay/Timeout
#   - Attribut-/Event-/Link-Limits
# Produktionsstrategie:
# - Head Sampling in der App: always_on (alle Traces gehen an den Collector)
# - Tail Sampling im Collector:
#   - alle ERROR-Traces behalten
#   - alle langsamen Traces behalten (>= 1s)
#   - business-kritische Order-Lifecycle-Endpunkte behalten
#   - technische /q/*-Endpunkte stark herunter-samplen
#   - verbleibende normale/schnelle Traces probabilistisch behalten
# Endpunkt-Priorisierung ist konfiguriert in:
#   docker/otel-collector/otel-collector.yaml (tail_sampling.policies)
# ----------------------------------------
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.traces.sampler=always_on
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

# Konzept fuer Umgebungs-Overrides (lokal vs. Compose vs. CI/CD):
# - Lokal: Fallback-Defaults werden genutzt (z. B. localhost-Endpoint).
# - Docker Compose: Umgebungsvariablen in den Service-Definitionen setzen.
# - CI/CD/Produktion: Variablen ueber Pipeline/Secret-Manager injizieren, nicht hier hart codieren.
# Beispiel:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 (Compose)
#   OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-gateway.prod.example (CI/CD)

# BSP (Batch Span Processor) Tuning: Overhead vs. Speicher
# - max.queue.size: hoeher = mehr Puffer (mehr Speicher), weniger verlorene Spans bei Bursts.
#   Erhoehen bei Lastspitzen/Export-Latenz; senken bei knappen Speicherbudgets.
# - max.export.batch.size: hoeher = effizienterer Export, aber groessere Payloads/Latenzspitzen.
#   Erhoehen bei hohem Durchsatz und stabilen Netzen; senken bei Throttling durch Exporter/Backend.
# - schedule.delay: niedriger = frischere Telemetrie, hoeherer CPU/Netzwerk-Overhead.
#   Senken fuer nahezu Echtzeit-Debugging; erhoehen zur Overhead-Reduktion.
# - export.timeout: hoeher = weniger Timeout-Drops bei langsamen Backends, aber laenger blockierte Export-Zyklen.
#   Erhoehen bei instabilen/entfernten Backends; senken fuer schnelles Fail-Fast bei Backend-Problemen.
quarkus.otel.bsp.max.queue.size=2048
quarkus.otel.bsp.max.export.batch.size=512
quarkus.otel.bsp.schedule.delay=200ms
quarkus.otel.bsp.export.timeout=10s

# Payload-Limits: Overhead, Speicher und Datenschutz
# - Hoehere Limits erfassen mehr Kontext, erhoehen aber Speicher-, Bandbreiten- und Storage-Kosten.
# - Niedrigere Limits reduzieren Kosten und PII-Risiken, koennen aber Diagnostik abschneiden.
# - Nur fuer begruendete Troubleshooting-Faelle erhoehen.
# - Senken, wenn Payload-Groesse, sensible Daten oder Backend-Ingest-Kosten kritisch sind.
quarkus.otel.attribute.count.limit=128
quarkus.otel.attribute.value.length.limit=256
quarkus.otel.span.attribute.count.limit=64
quarkus.otel.span.attribute.value.length.limit=256
quarkus.otel.span.event.count.limit=64
quarkus.otel.span.link.count.limit=32

# Produktions-Hardening-Checkliste
# - Sampling: always_on nicht blind in Produktion beibehalten; Head-/Tail-Sampling nach SLO/Risiko tunen.
# - PII und Limits: emittierte Attribute/Events auf personenbezogene Daten pruefen und Limits streng setzen.
# - Retention: sinnvolle Defaults in Loki/Tempo definieren (z. B. kurz fuer hochvolumige Debug-Daten,
#   laenger fuer audit-relevante business-kritische Traces), um Compliance und Storage-Kosten zu steuern.

mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.tresen-orders-out.connector=smallrye-kafka
mp.messaging.outgoing.tresen-orders-out.topic=coffee-orders-submitted
mp.messaging.outgoing.tresen-orders-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.tresen-orders-out.acks=all
mp.messaging.outgoing.tresen-orders-out.enable.idempotence=true

mp.messaging.incoming.kueche-orders-in.connector=smallrye-kafka
mp.messaging.incoming.kueche-orders-in.topic=coffee-orders-submitted
mp.messaging.incoming.kueche-orders-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.kueche-orders-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.kueche-orders-in.dead-letter-queue.topic=coffee-orders-submitted-dlq
mp.messaging.incoming.kueche-orders-in.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.kueche-orders-out.connector=smallrye-kafka
mp.messaging.outgoing.kueche-orders-out.topic=coffee-orders-ready
mp.messaging.outgoing.kueche-orders-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.tresen-ready-in.connector=smallrye-kafka
mp.messaging.incoming.tresen-ready-in.topic=coffee-orders-ready
mp.messaging.incoming.tresen-ready-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.tresen-ready-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.tresen-ready-in.dead-letter-queue.topic=coffee-orders-ready-dlq
mp.messaging.incoming.tresen-ready-in.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

kueche.processing.delay.min-seconds=2
kueche.processing.delay.max-seconds=20
outbox.dispatch.tick=1s
outbox.dispatch.min-seconds=1
outbox.dispatch.max-seconds=15

quarkus.datasource.jdbc.telemetry=true
